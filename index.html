                    .map(
                        (x) =>
                            `<div class="bx"><div style="font-size:1.6rem">${x[0]}</div><b>${x[1]}</b><p class="sb">${x[2]}</p></div>`
                    )
                    .join(
                        ""
                    )}</div><h2 style="margin-top:26px">Proyectos destacados</h2><div class="grid">${P.map((p, i) => `<div class="card" onclick="op(${i})"><div class="ph" data-l="Foto simulada">${ph(i)}</div><div class="bd"><h3>${p.n}</h3><p class="sb">${p.b} · USD ${n(p.u)}/m²</p></div></div>`).join("")}</div>`;
            const mercado = () => {
                const raw = P.map((p) => p.c * 0.35 + p.r * 6 + (3500 - p.u) / 25 + (240 - p.e) / 8),
                    mx = Math.max(...raw),
                    row = (t, g, m, f) =>
                        `<h4>${t}</h4>` +
                        P.map(
                            (p) =>
                                `<div class="ml"><span style="width:160px">${p.b} · ${p.t}</span><div class="bar" style="flex:1;margin:6px 10px"><i style="width:${(g(p) / m) * 100}%;background:var(--rc)"></i></div><b>${f(p)}</b></div>`
                        ).join("");
                return `<h2>Mercado por barrio</h2><p class="sb">Cruce automático de todos los desarrollos cargados</p>${row(
                    "Valor USD/m²",
                    (p) => p.u,
                    4000,
                    (p) => n(p.u)
                )}${row(
                    "Expensas ($ miles)",
                    (p) => p.e,
                    300,
                    (p) => p.e
                )}${row(
                    "Índice de confiabilidad",
                    (p) => p.c,
                    100,
                    (p) => p.c
                )}<h4>Índice de valor (precio, expensas, confiabilidad y reseñas)</h4>${P.map((p, i) => [
                    Math.round((raw[i] / mx) * 100),
                    i,
                ])
                    .sort((a, b) => b[0] - a[0])
                    .map(
                        (x) =>
                            `<div class="kv"><span><a href="#" onclick="op(${x[1]});return false">${P[x[1]].n}</a></span><b>${x[0]}/100</b></div>`
                    )
                    .join("")}`;
            };
            const como = () =>
                `<h2>Cómo funciona</h2><div class="g2" style="margin-top:12px">${[
                    [
                        "1",
                        "Filtrás gratis",
                        "Marcás tus prioridades y ves el índice de compatibilidad de cada proyecto.",
                    ],
                    ["2", "Compartís tu ficha", "Cuando algo te cierra, pagás $10.000 para enviarla."],
                    [
                        "3",
                        "La desarrolladora acepta",
                        "Paga $50.000 para recibir un prospecto con alta compatibilidad.",
                    ],
                    ["4", "Contacto directo", "Con ambos pagos se intercambian fichas y datos de contacto."],
                ]
                    .map((x) => `<div class="bx"><h3>${x[0]}. ${x[1]}</h3><p class="sb">${x[2]}</p></div>`)
                    .join(
                        ""
                    )}</div><div class="bx"><h4>Privacidad</h4><p class="sb">Tu perfil se borra de nuestra base y solo se comparte cuando hay match. Las desarrolladoras publican datos abiertos.</p></div><div class="bx"><h4>Confianza</h4><p class="sb">Reseñas con Gmail (una por cuenta), fotos reales de obra (los renders van etiquetados) y documentos descargables de cada hito.</p></div><div class="g2"><div class="bx"><b>Comprador</b><p class="sb">Buscar y comparar: gratis · Compartir ficha: $10.000</p></div><div class="bx"><b>Desarrolladora</b><p class="sb">Perfil público gratis · Recibir ficha: $50.000</p></div></div>`;
            const perfil = () => {
                const p = P[st.p];
                return `<p class="sb"><a href="#" onclick="op(st.p);return false">← Volver al proyecto</a></p><h2>${p.d}</h2><p class="sb">CUIT y matrícula verificados · sin juicios registrados</p><div class="g2" style="margin-top:12px">${[
                    ["9", "obras entregadas"],
                    ["612", "unidades vendidas"],
                    ["18 años", "de trayectoria"],
                ]
                    .map(
                        (x) =>
                            `<div class="bx" style="text-align:center"><h2>${x[0]}</h2><p class="sb">${x[1]}</p></div>`
                    )
                    .join("")}</div>${T[2](p)}${T[4](p)}`;
            };
            const p0 = (v, k) => {
                    P[0][k] = +v;
                },
                tf = (k) => {
                    const f = P[0].f,
                        i = f.indexOf(k);
                    i < 0 ? f.push(k) : f.splice(i, 1);
                    render();
                };
            const proyecto = () => {
                const p = P[0],
                    t = Object.keys(lab),
                    ok = t.filter((k) => p.f.includes(k)).length,
                    pc = Math.round((ok / t.length) * 100);
                return `<h2>Mi proyecto: ${p.n}</h2><p class="sb">Lo que tildás se publica en tu ficha y alimenta el índice de compatibilidad de los compradores.</p><div class="bar" style="margin:12px 0"><i style="width:${pc}%"></i></div><p class="sb">Ficha completa al ${pc}%</p><div class="g2"><div><h4>USD por m²</h4><input class="st" type="number" value="${p.u}" oninput="p0(this.value,'u')"></div><div><h4>Expensas ($ miles)</h4><input class="st" type="number" value="${p.e}" oninput="p0(this.value,'e')"></div><div><h4>Año de entrega</h4><input class="st" type="number" value="${p.y}" oninput="p0(this.value,'y')"></div></div>${FL.map((g) => `<h4>${g[0]}</h4>` + g[1].map((x) => `<span class="c${p.f.includes(x[0]) ? " m" : ""}" onclick="tf('${x[0]}')">${x[1]}</span>`).join("")).join("")}<button class="btn" onclick="dl('Brochure subido (demo)')">Subir brochure y planos</button>`;
            };
            const resenas = () => {
                const a = (R.reduce((s, r) => s + r[1], 0) / R.length).toFixed(1).replace(".", ",");
                return `<h2>Reseñas recibidas</h2><p class="sb">Solo usuarios con Gmail verificado, una reseña por cuenta.</p><div class="row"><h2>★ ${a}</h2><span class="sb">${R.length} reseñas</span></div>${[5, 4, 3, 2, 1].map((k) => `<div class="ml"><span>${k} ★</span><div class="bar" style="flex:1;margin:6px 10px"><i style="width:${(R.filter((r) => r[1] == k).length / R.length) * 100}%"></i></div></div>`).join("")}<div class="bx">${R.map((r) => `<div class="kv"><span><b>${r[0]}</b> ${stars(r[1])}<br>${r[2]}</span><span class="c" onclick="dl('Respuesta enviada (demo)')">Responder</span></div>`).join("")}</div>`;
            };
            const V = {
                inicio,
                buscar,
                mercado,
                como,
                perfil,
                ficha,
                comparar,
                costos,
                compartir,
                leads,
                proyecto,
                obra,
                resenas,
            };
            function render() {
                nav();
                M.innerHTML = V[st.v]();
                if (st.v == "buscar") res();
            }
            render();
        </script>
    </body>
</html>
