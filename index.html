<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ladrillo Hub — Desarrollos comparables</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--rc:#e7384f;--rt:#fde8ea;--ink:#222;--gr:#717171;--ln:#e4e4e4;--bg:#fff;--soft:#f7f7f7;--ok:#00895d;--okt:#e1f5ec;--wn:#b8860b;--wnt:#fff6de;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:auto;background:#fff;overflow-x:hidden;overflow-x:clip;max-width:100vw}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
h2,h3,h4,p{margin:0}h2{font-size:1.4rem}h3{font-size:.98rem}h4{font-size:.86rem;margin:14px 0 6px}
a{color:var(--rc)}button,input,select,textarea{font:inherit;color:inherit}
.sb{color:var(--gr);font-size:.82rem}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln);max-width:100vw}
.hd{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{font-weight:800;color:var(--rc);font-size:1.1rem;white-space:nowrap;flex-shrink:0}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0}
.role{display:flex;gap:6px;align-items:center;flex-shrink:0;min-width:0;margin-left:auto}
.role .sb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
nav button,.tb button,.role button{border:1px solid var(--ln);background:var(--bg);color:var(--gr);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.8rem;cursor:pointer;white-space:nowrap;flex-shrink:0}
nav button.on,.tb button.on{background:var(--rc);color:#fff;border-color:var(--rc)}
.role button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:700px){.hd{flex-wrap:wrap}nav{order:3;flex-basis:100%}}
@media (max-width:480px){.hd{gap:8px;padding:9px 12px}.brand{font-size:.98rem}.role .sb{max-width:120px;margin-right:4px}nav button,.role button{padding:6px 11px;font-size:.76rem}}
#resbar{display:none}
#resbar.show{display:block;height:62px;pointer-events:none}
#resbar.show .rbi{pointer-events:auto;display:flex;justify-content:center;align-items:center;gap:6px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:700;font-size:.8rem;text-align:center;cursor:pointer;position:fixed;top:calc(5px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;width:calc(100% - 24px);max-width:720px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.buscando header{position:static}
.legend{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.76rem;color:var(--gr)}
.legend .c{cursor:default;margin:2px 4px 2px 0}.legend p{margin-top:6px}
.seg{display:flex;gap:4px;margin-top:6px}.seg button{flex:1;border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:5px 2px;font-size:.7rem;font-weight:700;cursor:pointer}
.seg button.on.d{background:var(--ok);color:#fff;border-color:var(--ok)}.seg button.on.r{background:var(--wn);color:#fff;border-color:var(--wn)}.seg button.on.v{background:var(--ink);color:#fff;border-color:var(--ink)}
.stk{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.stk div{flex:1;min-width:90px;border:1px solid var(--ln);border-radius:12px;padding:8px;text-align:center}.stk b{display:block;font-size:1.3rem}.stk span{font-size:.7rem;color:var(--gr)}
.urow{border:1px solid var(--ln);border-radius:12px;padding:10px;margin-top:8px}.urow.sold{opacity:.55}
.tblw{overflow-x:auto}
#resbar.show.hit .rbi{background:var(--rc)}
main{max-width:1200px;margin:auto;padding:18px 16px 70px}
.lay{display:grid;gap:22px}
.fl{display:block;border:1px solid var(--ln);border-radius:16px;padding:14px}
.fb{display:block;width:100%;margin-bottom:14px;padding:12px;border:1px solid var(--ink);border-radius:12px;background:none;font-weight:700;cursor:pointer;text-align:center}
@media (min-width:900px){.lay{grid-template-columns:290px 1fr}.fl{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}.buscando .fl{top:64px}.fx{grid-template-columns:1fr 320px!important}.as{position:sticky;top:76px}}
.c{display:inline-block;margin:0 6px 6px 0;padding:7px 12px;border:1px solid var(--ln);border-radius:99px;font-size:.78rem;cursor:pointer;background:var(--bg)}
.c.w{border-color:var(--rc);background:var(--rt);color:var(--rc)}
.c.m{background:var(--rc);border-color:var(--rc);color:#fff}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:14px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{border:1px solid var(--ln);border-radius:16px;overflow:hidden;cursor:pointer}
.card.dim{opacity:.55}
.card.static{cursor:default}
.ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:#ddd;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#999;font-size:.7rem;text-align:center;padding:8px}
.card .ph{border-radius:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:attr(data-l);position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.6rem;padding:2px 7px;border-radius:99px}
.cm{position:absolute;left:10px;bottom:10px;background:#fff;color:#222;font-weight:800;font-size:.72rem;padding:4px 10px;border-radius:99px;z-index:1}
.bd{padding:12px 14px}
.r1{display:flex;justify-content:space-between;gap:8px}
.wn{color:var(--wn);font-size:.78rem;font-weight:700;margin-top:4px}
.ok{color:var(--ok);font-weight:700}
.best{color:var(--ok);font-weight:800}
.fx{display:grid;gap:22px;margin-top:8px;min-width:0}
.as,.bx{border:1px solid var(--ln);border-radius:16px;padding:16px;min-width:0}
.as{align-self:start}
.bx{margin-top:12px;border-radius:14px;padding:12px 14px}
.tb{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:.86rem}
.kv span{color:var(--gr)}.kv b{text-align:right}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--ln) 0);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.ring i{width:68px;height:68px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:1.1rem}
.btn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--ink);background:none;font-weight:700;cursor:pointer;text-align:center}
.pri{background:var(--rc);border-color:var(--rc);color:#fff}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:12px;align-items:center;margin:8px 0}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;background:var(--rt);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--rc)}
.tg{font-size:.66rem;padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.tg.v{background:var(--okt);color:var(--ok)}.tg.e{background:var(--wnt);color:var(--wn)}.tg.d{background:var(--rt);color:var(--rc)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
td,th{padding:9px 6px;border-bottom:1px solid var(--ln);text-align:center}
td:first-child,th:first-child{text-align:left}
.st{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);margin-top:6px}
input[type="range"]{width:100%;accent-color:var(--rc)}
.ml{display:flex;justify-content:space-between;font-size:.8rem;padding:5px 0;border-bottom:1px solid var(--ln)}
.ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.8rem;opacity:0;transition:.3s;pointer-events:none;z-index:30}
.load{text-align:center;padding:40px;color:var(--gr)}
.setup{max-width:520px;margin:60px auto;border:1px solid var(--ln);border-radius:16px;padding:24px}
.setup code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:.82rem}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bx{background:var(--bg);border-radius:18px;max-width:520px;width:100%;padding:28px 24px;text-align:center;max-height:90vh;overflow:auto}
.modal-fit{display:flex;flex-direction:column;padding:16px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:hidden}
.modal-fit h2{font-size:1.15rem}.modal-fit .scr{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;text-align:left;font-size:.72rem;line-height:1.45;color:var(--gr);margin-top:10px}
.modal-fit .scr{min-height:96px}
@media (max-height:740px){.modal-fit{padding:12px}.modal-fit h2{font-size:1rem}.modal-fit>p.sb{display:none}.rolgrid .bx p{display:none}.rolgrid .bx{padding:8px}.modal-fit .scr{margin-top:8px}}
.modal-fit .foot{flex:none;padding-top:10px}.modal-fit .foot .btn{margin-top:6px;padding:10px}
.rolgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.rolgrid .bx{margin:0;padding:10px}.rolgrid h3{font-size:.85rem}.rolgrid p{font-size:.7rem;margin:4px 0}.rolgrid .btn{padding:8px 4px;font-size:.78rem;margin-top:4px}
footer{border-top:1px solid var(--ln);margin-top:44px;padding:26px 16px calc(90px + env(safe-area-inset-bottom,0px));text-align:center}
footer .flink{color:var(--gr);font-size:.82rem;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.icon{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cover{position:relative;width:100%;aspect-ratio:3/1;border-radius:16px;background:var(--soft) center/cover no-repeat;overflow:hidden}
.fcar{position:relative;width:100%;aspect-ratio:3/1;border-radius:16px;overflow:hidden;background:var(--soft);margin-bottom:16px}
.fcar-track{display:flex;height:100%;transition:transform .35s ease}
.fcar-track img{width:100%;height:100%;object-fit:cover;flex:none;background:var(--soft)}
.fcar-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.fcar-arrow.prev{left:10px}.fcar-arrow.next{right:10px}
.fcar-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;z-index:2}
.fcar-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
.fcar-dots span.on{background:#fff}
.fcar-tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.65rem;padding:3px 9px;border-radius:99px;z-index:2}
.fcar-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--gr);font-size:.82rem}
.chk-v{display:inline-flex;align-items:center;gap:4px;background:var(--okt);color:var(--ok);font-weight:700;font-size:.72rem;padding:3px 10px;border-radius:99px;vertical-align:middle}
.timeline{border-left:2px solid var(--ln);margin:14px 0 0 8px;padding-left:18px}
.tl-it{position:relative;padding-bottom:18px}
.tl-it::before{content:"";position:absolute;left:-23px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--rc)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
.hist{font-size:1.7rem;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--wnt);color:var(--wn);font-weight:700;font-size:.72rem;padding:5px 11px;border-radius:99px;margin:0 6px 6px 0}
.badge.gold{background:#fff2cc;color:#8a6d00}
.avwrap{position:relative;width:100%}
.avwrap .cover{margin-bottom:0}
.profpic{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);background:var(--rt);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--rc);font-size:1.6rem}
.profpic-dev{position:absolute;left:50%;bottom:-48px;transform:translateX(-50%);z-index:2;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.profpic-comp{margin:14px auto 4px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.dev-after-cover{margin-top:56px;text-align:center}
.doc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-top:8px}
.doc-row.on{border-color:var(--rc)}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--ln);flex:none;cursor:pointer}
.sw.on{background:var(--rc)}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{left:18px}
.floorbox{display:flex;align-items:center;gap:8px;margin-top:6px}
.pendbox{background:var(--wnt);border:1px solid var(--wn);border-radius:12px;padding:12px 14px;margin-top:10px}
.rbox{background:var(--rt);border:1px solid var(--rc);border-radius:12px;padding:12px 14px;margin-top:14px}
.okbox{background:var(--okt);border:1px solid var(--ok);border-radius:12px;padding:12px 14px;margin-top:14px}
.frow{display:flex;gap:12px;align-items:flex-start;margin:16px 0}
.frow .fi{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.frow b{display:block;margin-bottom:2px}
.pricehero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:16px 0;padding:16px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.pricehero .amt{font-size:2.1rem;font-weight:800;color:var(--rc);white-space:nowrap}
.steps4{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;padding-bottom:4px}
.step4{flex:1;min-width:120px;text-align:center}
.step4 .si{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.step4-arrow{align-self:center;color:var(--gr);flex:none}
.previewgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:10px}
.previewgrid .pi{border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.previewgrid .pi span{display:block;color:var(--gr);font-size:.72rem}
.previewgrid .pi b{font-size:.92rem}

#guestBanner{display:none}
#guestBanner img{width:100%;display:block;cursor:pointer}

/* ===== Landing pública (tab Inicio, sin sesión) ===== */
.lh-hero{padding:8px 0 4px}
.lh-hero h1{font-size:clamp(1.5rem,4.2vw,2.5rem);line-height:1.14;letter-spacing:-.01em;font-weight:800}
.lh-hero-grid{display:grid;gap:26px;grid-template-columns:1.1fr .9fr;align-items:center;margin-top:6px}
@media (max-width:900px){.lh-hero-grid{grid-template-columns:1fr}}
.lh-cta-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.lh-match{border:1px solid var(--ln);border-radius:16px;padding:18px;background:var(--soft)}
.lh-match-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.lh-match-side{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:14px}
.lh-match-side h4{font-size:.72rem;color:var(--gr);font-weight:600;margin-bottom:4px}
.lh-match-side .big{font-size:1.05rem;font-weight:800}
.lh-match-pct{width:54px;height:54px;border-radius:50%;background:var(--rc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.84rem;margin:0 auto}
.lh-match-foot{margin-top:12px;font-size:.76rem;color:var(--gr);border-top:1px dashed var(--ln);padding-top:12px}
.lh-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:18px 0}
@media (max-width:700px){.lh-stats{grid-template-columns:repeat(2,1fr)}}
.lh-stat b{display:block;font-weight:800;font-size:1.25rem}
.lh-stat span{font-size:.74rem;color:var(--gr)}
.lh-sec{margin-top:42px}
.lh-eyebrow{color:var(--rc);font-weight:700;font-size:.78rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.lh-sides{display:grid;gap:18px;grid-template-columns:1fr 1fr;margin-top:18px}
@media (max-width:800px){.lh-sides{grid-template-columns:1fr}}
.lh-side{border:1px solid var(--ln);border-radius:16px;padding:20px;background:var(--bg)}
.lh-side.comprador{border-top:4px solid var(--rc)}
.lh-side.desarrolladora{border-top:4px solid var(--ink)}
.lh-tag{display:inline-block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:20px;margin-bottom:10px}
.lh-tag.comprador{background:var(--rt);color:var(--rc)}
.lh-tag.desarrolladora{background:var(--soft);color:var(--ink)}
.lh-side h3{font-size:1.1rem;margin-bottom:8px}
.lh-steps{list-style:none;margin:12px 0 0;padding:0;counter-reset:lh-step}
.lh-steps li{counter-increment:lh-step;display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.lh-steps li:first-child{border-top:none}
.lh-steps li::before{content:counter(lh-step);flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--soft);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700}
.lh-steps b{display:block;font-size:.85rem}
.lh-steps small{color:var(--gr);font-size:.74rem}
.lh-price{margin-top:14px;padding-top:14px;border-top:1px solid var(--ln);display:flex;align-items:baseline;gap:8px}
.lh-price .amt{font-weight:800;font-size:1.45rem}
.lh-price .note{font-size:.74rem;color:var(--gr)}
.lh-refund{margin-top:10px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.74rem;color:var(--gr)}
.lh-refund b{color:var(--ok)}
.lh-filters{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);margin-top:16px}
@media (max-width:760px){.lh-filters{grid-template-columns:1fr}}
.lh-fgroup{border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.lh-fgroup h4{font-size:.8rem;margin-bottom:8px;color:var(--rc)}
.lh-chips{display:flex;flex-wrap:wrap;gap:6px}
.lh-chip{border:1px solid var(--ln);border-radius:20px;padding:5px 11px;font-size:.72rem;color:var(--gr)}
.lh-trust{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);margin-top:16px}
@media (max-width:820px){.lh-trust{grid-template-columns:1fr}}
.lh-trust-card{border:1px solid var(--ln);border-radius:14px;padding:16px;background:var(--soft)}
.lh-trust-card h4{font-size:.9rem;margin:8px 0 6px}
.lh-trust-card p{font-size:.8rem;color:var(--gr)}
.lh-claim{background:var(--ink);color:#f3efe9;border-radius:18px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;margin-top:16px}
@media (max-width:800px){.lh-claim{grid-template-columns:1fr}}
.lh-claim h2{color:#fff;font-size:1.3rem}
.lh-claim p{color:#c9c2b6;margin-top:10px;font-size:.85rem}
.lh-claim-card{background:rgba(255,255,255,.08);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,.15)}
.lh-claim-card h5{font-size:.85rem;margin-bottom:3px;font-weight:800}
.lh-claim-card span{font-size:.74rem;color:#b3aa9e}
.lh-claim-status{font-size:.7rem;font-weight:700;margin-top:6px;display:inline-block}
.lh-claim-status.pending{color:#e0a836}
.lh-claim-status.rejected{color:#c96a5c}
.lh-claim-status.open{color:#8fbf9f}

async function boot() {
  if (authErrorURL) {
    console.error("Error de autenticación:", authErrorURL);
    const box = document.getElementById("authErr");
    box.style.display = "block";
    box.innerHTML = `<div class="bx" style="background:var(--wnt);border-color:var(--wn)"><b>No se pudo completar el ingreso con Google</b><p class="sb" style="margin-top:4px">${authErrorURL.desc}${authErrorURL.code ? " (" + authErrorURL.code + ")" : ""}</p></div>`;
    history.replaceState({}, "", location.pathname);
  }
  if (!configurado) {
    document.getElementById("M").innerHTML = `<div class="setup">
      <h2>Falta configurar Supabase</h2>
      <p class="sb" style="margin-top:10px">Este archivo es la app real, pero necesita apuntar a tu proyecto de Supabase. Editá las primeras líneas del <code>&lt;script&gt;</code>:</p>
      <div class="bx"><code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code></div>
      <p class="sb" style="margin-top:10px">Los sacás de tu Dashboard de Supabase → Project Settings → API. Después corré <code>supabase/schema.sql</code> y <code>supabase/seed_real_data.sql</code> en el SQL Editor, y activá el proveedor Google en Authentication → Providers.</p>
    </div>`;
    document.getElementById("nav").innerHTML = "";
    return;
  }

  // OJO: no llamar a sb.* directamente dentro de este callback (puede trabar el login).
  // Por eso se difiere con setTimeout.
  sb.auth.onAuthStateChange((event, session) => {
    st.session = session;
    if (event === "SIGNED_OUT") resetSesionUI();
    if (event === "SIGNED_IN" && session) {
      sb.rpc("incrementar_ingreso", { uid: session.user.id }).catch(e => console.error("incrementar_ingreso:", e));
    }
    setTimeout(afterAuth, 0);
  });

  const { data } = await sb.auth.getSession();
  st.session = data.session;
  await cargarCatalogoFeatures();
  await cargarProyectos();
  await afterAuth();
}

async function cargarCatalogoFeatures() {
  const { data, error } = await sb.from("feature_catalog").select("*").order("orden");
  if (error) { console.error(error); return; }
  st.featureCatalog = data || [];
  st.featuresByGroup = {};
  st.labByKey = {};

    st.labByKey[f.key] = f.label;

async function cargarProyectos() {
  const { data, error } = await sb
    .from("proyectos")
    .select("*, desarrolladoras(nombre, verificado, anios_trayectoria, obras_entregadas, sin_juicios_registrados, sitio_web, perfil_id)")
    .eq("publicado", true)
    .order("indice_confiabilidad", { ascending: false });

let authRun = 0;
async function afterAuth() {
  const run = ++authRun;               // si llega otra corrida más nueva, esta se descarta
  let perfil = null, des = null, ficha = null;
  if (st.session) {
    const r = await sb.from("perfiles").select("*").eq("id", st.session.user.id).maybeSingle();
    if (r.error) { console.error("perfiles:", r.error); toast("Error leyendo tu perfil: " + r.error.message); }
    perfil = r.data;
    if (perfil?.rol === "desarrolladora") {
      const d = await sb.from("desarrolladoras").select("*").eq("perfil_id", perfil.id).maybeSingle();
      des = d.data;
    }
    if (perfil?.rol === "comprador") {
      const f = await sb.from("fichas_compradoras").select("*").eq("perfil_id", perfil.id).maybeSingle();
      ficha = f.data;
      const t = await sb.from("perfiles_contacto").select("telefono").eq("perfil_id", perfil.id).maybeSingle();
      st.telefono = t.data?.telefono || null;
    }
  }
  if (run !== authRun) return;
  st.perfil = perfil; st.desarrolladora = des; st.ficha = ficha;
  if (!st.session) { st.leads = []; st.misSolicitudesReclamo = []; }
  else if (perfil?.rol === "comprador") await cargarLeadsComprador();
  else if (perfil?.rol === "desarrolladora" && des) { await cargarLeadsDesarrolladora(); await cargarMisSolicitudesReclamo(); }
  if (run !== authRun) return;
  render();
}

// para no dejarla mandar la misma solicitud dos veces y para mostrarle el
// estado (pendiente / aprobado / rechazado) en cada ficha.

  if (!st.desarrolladora) { st.misSolicitudesReclamo = []; return; }
  const { data, error } = await sb
    .from("solicitudes_reclamo")
    .select("*")
    .eq("desarrolladora_id", st.desarrolladora.id);

async function reclamarFicha(proyectoId) {
  if (!st.session) return loginGoogle();
  if (st.perfil?.rol !== "desarrolladora" || !st.desarrolladora) {
    toast("Para reclamar una ficha necesitás una cuenta de desarrolladora.");
    return;
  }
  const yaExiste = (st.misSolicitudesReclamo || []).some(s => s.proyecto_id === proyectoId);
  if (yaExiste) { toast("Ya enviaste una solicitud para esta ficha."); return; }

  const { data, error } = await sb
    .from("solicitudes_reclamo")
    .insert({ proyecto_id: proyectoId, desarrolladora_id: st.desarrolladora.id })
    .select()
    .single();
  if (error) { toast("No se pudo enviar la solicitud: " + error.message); console.error(error); return; }

  st.misSolicitudesReclamo = [...(st.misSolicitudesReclamo || []), data];
  toast("Solicitud enviada. La vamos a revisar y te avisamos cuando quede activa.");
  render();
}

// Intenta reconocer a la desarrolladora por el Gmail con el que se logueó
// (evita crear una cuenta duplicada de una que ya sembramos por su cuenta).
// Si no hay match, le muestra una lista para que elija manualmente a cuál
// pertenece, en vez de crearle una cuenta nueva sin querer.
async function vincularOCrearDesarrolladora(u, nombre) {
  const emailLower = (u.email || "").toLowerCase();

  // 1) Match automático por email_provisorio, entre las que todavía
  //    no tienen cuenta vinculada.
  const match = await sb.from("desarrolladoras")
    .select("id,nombre")
    .is("perfil_id", null)
    .ilike("email_provisorio", emailLower)
    .maybeSingle();
  if (match.error) console.error("match desarrolladora por email:", match.error);
  if (match.data) {
    const up = await sb.from("desarrolladoras").update({ perfil_id: u.id }).eq("id", match.data.id);
    if (up.error) { console.error("vincular desarrolladora:", up.error); toast("No se pudo vincular tu cuenta: " + up.error.message); }
    else {
      toast(`Reconocimos tu cuenta como ${match.data.nombre}.`);
      // Match por email = confianza alta: los proyectos que ya le habíamos
      // pre-vinculado dejan de figurar como "sin reclamar" para todo el
      // mundo. La vinculación manual (más abajo) NO hace esto —
      // queda pendiente de revisión.
      const upP = await sb.from("proyectos")
        .update({ reclamado: true })
        .eq("desarrolladora_id", match.data.id)
        .eq("reclamado", false);
      if (upP.error) console.error("marcar proyectos reclamados:", upP.error);
    }
    st.eligiendoDesarrolladora = false;
    return;
  }

  // 2) Sin match: le mostramos las desarrolladoras sin reclamar para
  //    que elija manualmente a cuál pertenece (con confirmación).
  const { data: sinReclamar, error } = await sb.from("desarrolladoras")
    .select("id,nombre,sitio_web")
    .is("perfil_id", null)
    .order("nombre");
  if (error) console.error("desarrolladoras sin reclamar:", error);
  st.desarrolladorasSinReclamar = sinReclamar || [];
  const sp = await sb.from("proyectos").select("nombre,desarrolladora_id").eq("reclamado", false);
  st.proyectosSinDueno = {};
  (sp.data || []).forEach(x => x.desarrolladora_id && (st.proyectosSinDueno[x.desarrolladora_id] ??= []).push(x.nombre));
  st.buscaDev = "";
  st.eligiendoDesarrolladora = true;
  render();
}

    .eq("id", desarrolladoraId)

}

// BARRA FLOTANTE DE RESULTADOS (vista "Buscar")
// =====================================================================
function filtrarProyectos() {
  return st.proyectos.filter(p =>
    (!st.b.length || st.b.includes(p.barrio)) &&
    (!st.t.length || st.t.includes(p.tipo)) &&
    (p.precio_usd_m2||0) <= st.m &&
    (p.expensas_miles||9999) <= st.e &&
    (!st.docsFiltro.length || st.docsFiltro.every(k => proyectoTieneDoc(p, k))) &&
    proyectoCumpleEstructura(p) &&
    (!filtrosUnidadActivos() || unidadesDe(p).some(u => u.estado === "disponible" && unidadCumple(u, p)))
  );
}
const unidadesDe = (p) => st.unidadesByProy[p.id] || [];
function unidadCumple(u, p) {
  const f = st.f;
  if (f.amb.length && !f.amb.includes(Math.min(u.ambientes || 0, 4))) return false;
  if (f.ori.length && !f.ori.includes(u.orientacion || p.orientacion)) return false;
  if (f.ubi.length && !f.ubi.includes(u.ubicacion)) return false;
  if (f.letras.length && !f.letras.includes(u.letra)) return false;
  if (f.supMin !== "" && (u.superficie_m2 || 0) < +f.supMin) return false;
  if (f.supMax !== "" && (u.superficie_m2 || 0) > +f.supMax) return false;
  if (f.pisoMin !== "" && (u.piso || 0) < +f.pisoMin) return false;
  return true;
}
// Filtros a nivel proyecto: unidades por piso y cantidad total de unidades
const filtrosProyectoActivos = () => { const f = st.f; return f.xpiso.length > 0 || f.totMin !== "" || f.totMax !== ""; };
function proyectoCumpleEstructura(p) {
  const f = st.f;
  if (f.xpiso.length && !f.xpiso.includes(Math.min(p.unidades_por_piso || 0, 5))) return false;
  const tot = unidadesDe(p).length;
  if (f.totMin !== "" && tot < +f.totMin) return false;
  if (f.totMax !== "" && (tot === 0 || tot > +f.totMax)) return false;
  return true;
}
const letrasDisponibles = () => {
  const set = new Set();
  Object.values(st.unidadesByProy || {}).forEach(a => a.forEach(u => u.letra && set.add(u.letra)));
  const arr = [...set].sort();
  return arr.length ? arr : LETRAS.slice(0, 6).split("");
};
const filtrosUnidadActivos = () => { const f = st.f; return f.amb.length || f.ori.length || f.ubi.length || f.letras.length || f.supMin !== "" || f.supMax !== "" || f.pisoMin !== "" || f.soloDisp; };
function filtrosActivos() {
  return st.b.length > 0 || st.t.length > 0 || st.docsFiltro.length > 0 ||
    Object.keys(st.q).length > 0 || st.m !== 4000 || st.e !== 300 || !!filtrosUnidadActivos() || filtrosProyectoActivos();
}
function pintarResBar() {
  const rb = document.getElementById("resbar");
  if (!rb) return;
  if (st.v !== "buscar") { rb.className = ""; rb.innerHTML = ""; rb.onclick = null; return; }
  if (!filtrosActivos()) {
    rb.className = "show";
    rb.innerHTML = '<div class="rbi">Empezá a filtrar y te diremos cuántos resultados encontramos</div>';
    rb.onclick = null;
  } else {
    const total = filtrarProyectos().length;
    rb.className = "show hit";
    rb.innerHTML = `<div class="rbi">${total} ${total===1?"resultado":"resultados"} encontrado${total===1?"":"s"} · ver abajo ↓</div>`;
    rb.onclick = () => document.getElementById("resLista")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  posResBar();
}
// Al inicio de la página el aviso queda debajo del header; al scrollear se
// queda a 5px del borde superior (funciona en Safari iOS sin depender de sticky).
function posResBar() {
  const host = document.getElementById("resbar"), bar = host && host.querySelector(".rbi");
  if (!bar) return;
  const top = host.getBoundingClientRect().top;
  bar.style.top = `max(calc(5px + env(safe-area-inset-top, 0px)), ${Math.round(top + 5)}px)`;
}
window.addEventListener("scroll", posResBar, { passive: true });

// =====================================================================
// COMPATIBILIDAD (equivalente a sc() del prototipo)
// =====================================================================
function sc(p) {
  const K = Object.keys(st.q);
  if (!K.length) return { s: 60 };
  let total = 0, logrado = 0;
  for (const k of K) {
    const peso = st.q[k] === 2 ? 2 : 1;
    total += peso;
    if ((p.features || []).includes(k)) logrado += peso;
  }
  return { s: total ? Math.round((logrado / total) * 100) : 60 };
}

  if (!st.proyectos.length) return `<h2>Mercado por barrio</h2><p class="sb">Todavía no hay proyectos cargados.</p>`;
  const row = (t, get, fmt) => {
    const vals = st.proyectos.map(get), mx = Math.max(...vals, 1);
    return `<h4>${t}</h4>` + st.proyectos.map(p=>`<div class="ml"><span style="width:170px">${p.barrio} · ${p.nombre}</span><div class="bar" style="flex:1;margin:6px 10px"><i style="width:${(get(p)/mx)*100}%;background:var(--rc)"></i></div><b>${fmt(get(p))}</b></div>`).join("");
  };
  return `<p class="sb">Cruce automático de los proyectos reales cargados en Palermo, Belgrano y Núñez</p>
  ${row("Valor USD/m²", p=>p.precio_usd_m2||0, v=>"USD "+n(v))}
  ${row("Índice de confiabilidad", p=>p.indice_confiabilidad||0, v=>v)}
  ${row("Reseñas", p=>p.rating||0, v=>v+" ★")}`;
}

function fichaCarousel() {
  const st_ = st.fotosProyecto;
  if (!st_ || !st_.items.length) {
    return `<div class="fcar"><div class="fcar-empty">Todavía no hay fotos cargadas de este proyecto</div></div>`;
  }
  const items = st_.items.slice(0, 5);
  const idx = Math.min(st_.idx, items.length - 1);
  const activo = items[idx];
  return `<div class="fcar">
    <div class="fcar-track" style="transform:translateX(-${idx*100}%)">
      ${items.map(f=>`<img src="${f.url}" alt="Foto del proyecto">`).join("")}
    </div>
    ${activo.tipo ? `<span class="fcar-tag">${activo.tipo==="real"?"Foto real":"Render"}</span>` : ""}
    ${items.length>1 ? `
      <button class="fcar-arrow prev" onclick="carouselNav(-1)" aria-label="Anterior">‹</button>
      <button class="fcar-arrow next" onclick="carouselNav(1)" aria-label="Siguiente">›</button>
      <div class="fcar-dots">${items.map((_,i)=>`<span class="${i===idx?"on":""}" onclick="carouselGoto(${i})"></span>`).join("")}</div>
    ` : ""}
  </div>`;
}
function carouselNav(dir) {
  const st_ = st.fotosProyecto; if (!st_) return;
  const len = Math.min(st_.items.length, 5);
  st_.idx = (st_.idx + dir + len) % len;
  render();
}
function carouselGoto(i) {
  const st_ = st.fotosProyecto; if (!st_) return;
  st_.idx = i; render();
}

async function ficha() {
  const p = st.proyectos[st.p];
  if (!p) return `<p class="sb">Proyecto no encontrado. <a href="#" onclick="go('buscar');return false">Volver</a></p>`;
  if (!st.resenas[p.id]) {
    const { data } = await sb.from("resenas").select("*, perfiles(nombre)").eq("proyecto_id", p.id).order("created_at",{ascending:false});
    st.resenas[p.id] = data || [];
  }
  if (!st.fotosProyecto || st.fotosProyecto.id !== p.id) {
    const { data } = await sb.from("proyecto_fotos").select("*").eq("proyecto_id", p.id).order("orden");
    const items = (data && data.length)
      ? data.map(f => ({ url: f.url, tipo: f.tipo }))
      : (Array.isArray(p.fotos) ? p.fotos.map(u => ({ url: u, tipo: null })) : []);
    st.fotosProyecto = { id: p.id, items, idx: 0 };
  }
  const x = sc(p), K = Object.keys(st.q);
  const tabsHTML = [tabResumen, tabCostos, tabSociedad, tabObraP, tabResenasP, tabConvivencia, tabUnidades];
  const yaEnLead = st.leads?.some(l => l.proyecto_id === p.id);
  return `<p class="sb"><a href="#" onclick="go('buscar');return false">← Volver a resultados</a></p>
  ${fichaCarousel()}
  <div class="fx"><div><h2>${p.nombre}</h2><p class="sb">${p.barrio}${p.subzona?" · "+p.subzona:""} · ${p.tipo} · ${p.reclamado ? (p.desarrolladoras?.nombre||"") : `${p.desarrolladora_nombre_provisorio||"Desarrolladora sin confirmar"} <span style="opacity:.7">(ficha sin reclamar)</span>`}</p>
  <div class="tb">${TN.map((t,i)=>`<button class="${i==st.tab?"on":""}" onclick="tab(${i})">${t}</button>`).join("")}</div>
  ${await tabsHTML[st.tab](p)}</div>
  <aside class="as"><div class="ring" style="--p:${x.s}"><i>${x.s}%</i></div><p style="text-align:center"><b>Compatibilidad con vos</b></p>
  <div style="margin:10px 0">${K.map(k=>{const h=(p.features||[]).includes(k);return `<div class="ml"><span>${st.labByKey[k]||k}${st.q[k]==2?" ★":""}</span><span class="${h?"ok":"wn"}">${h?"Cumple":"No tiene"}</span></div>`}).join("") || '<p class="sb">Marcá tus prioridades en Buscar.</p>'}</div>
  <button class="btn" onclick="go('comparar')">Comparar con otros</button>
  ${st.perfil?.rol==="comprador" ? (yaEnLead ? '<p class="ok" style="margin-top:10px">✔ Ya compartiste tu ficha con este proyecto</p>' : `<button class="btn pri" onclick="verPostulacion('${p.id}')">Compartir mi ficha</button>`) : ""}
  ${!st.session ? `<button class="btn pri" onclick="loginGoogle()">Ingresar para comparar</button>` : ""}
  ${reclamoBox(p)}
  </aside></div>`;
}

// Abre la pantalla de confirmación de postulación (previa al pago de $10.000)
// para el proyecto con mayor compatibilidad que el comprador eligió compartir.
function verPostulacion(proyectoId) {
  if (!st.telefono) { toast("Cargá tu teléfono (obligatorio) antes de postularte."); go("inicio"); return; }
  const idx = st.proyectos.findIndex(x => x.id === proyectoId);
  if (idx < 0) { toast("No se encontró el proyecto"); return; }
  st.p = idx;
  go("postulacion");
}

async function adminReclamos() {
  if (!st.perfil?.es_admin) return `<h2>Admin</h2><p class="sb">No tenés acceso a esta sección.</p>`;

  const { data, error } = await sb
    .from("solicitudes_reclamo")
    .select("*, proyectos(nombre,barrio), desarrolladoras(nombre,sitio_web)")
    .eq("estado", "pendiente")
    .order("creado_en", { ascending: true });

  if (error) { console.error(error); return `<h2>Admin</h2><p class="sb">Error cargando solicitudes: ${error.message}</p>`; }

  const pendientes = data || [];
  return `<h2>Reclamos de ficha pendientes</h2>
  <p class="sb" style="margin-bottom:16px">${pendientes.length} solicitud${pendientes.length===1?"":"es"} esperando revisión.</p>
  <div class="grid">${pendientes.map(s => `
    <div class="bx">
      <h3>${s.proyectos?.nombre || "(proyecto eliminado)"}</h3>
      <p class="sb">${s.proyectos?.barrio || ""}</p>
      <div class="kv"><span>Desarrolladora que reclama</span><b>${s.desarrolladoras?.nombre || ""}</b></div>
      ${s.desarrolladoras?.sitio_web ? `<div class="kv"><span>Sitio web</span><b><a href="${s.desarrolladoras.sitio_web}" target="_blank">Visitar</a></b></div>` : ""}
      <div class="kv"><span>Solicitado</span><b>${new Date(s.creado_en).toLocaleDateString("es-AR")}</b></div>
      <div class="row" style="margin-top:12px;gap:8px">
        <button class="btn pri" onclick="adminAprobarReclamo('${s.id}','${s.proyecto_id}','${s.desarrolladora_id}')">Aprobar</button>
        <button class="btn" onclick="adminRechazarReclamo('${s.id}')">Rechazar</button>
      </div>
    </div>`).join("") || '<p class="sb">No hay solicitudes pendientes por ahora.</p>'}
  </div>`;
}

async function adminAprobarReclamo(solicitudId, proyectoId, desarrolladoraId) {
  const { error: e1 } = await sb.from("proyectos")
    .update({ desarrolladora_id: desarrolladoraId, reclamado: true })
    .eq("id", proyectoId);
  if (e1) { toast("Error vinculando el proyecto: " + e1.message); console.error(e1); return; }

  const { error: e2 } = await sb.from("solicitudes_reclamo")
    .update({ estado: "aprobado", revisado_en: new Date().toISOString() })
    .eq("id", solicitudId);
  if (e2) { toast("El proyecto se vinculó pero no se pudo marcar la solicitud: " + e2.message); console.error(e2); return; }

  toast("Reclamo aprobado.");
  await cargarProyectos();
  render();
}

async function adminRechazarReclamo(solicitudId) {
  const { error } = await sb.from("solicitudes_reclamo")
    .update({ estado: "rechazado", revisado_en: new Date().toISOString() })
    .eq("id", solicitudId);
  if (error) { toast("Error: " + error.message); console.error(error); return; }
  toast("Solicitud rechazada.");
  render();
}

// Caja de "reclamar ficha", visible en el detalle del proyecto solo
// cuando la ficha todavía no fue reclamada por ninguna desarrolladora.
function reclamoBox(p) {
  if (p.reclamado) return "";
  const solicitud = (st.misSolicitudesReclamo || []).find(s => s.proyecto_id === p.id);
  if (solicitud) {
    const texto = solicitud.estado === "aprobado"
      ? "✔ Reclamo aprobado"
      : solicitud.estado === "rechazado"
      ? "Tu solicitud fue rechazada. Escribinos si creés que es un error."
      : "Tu solicitud está pendiente de revisión.";
    return `<p class="sb" style="margin-top:10px">${texto}</p>`;
  }
  if (!st.session) {
    return `<p class="sb" style="margin-top:10px">¿Sos esta desarrolladora? <a href="#" onclick="loginGoogle();return false">Ingresá</a> para reclamar esta ficha.</p>`;
  }
  if (st.perfil?.rol !== "desarrolladora") {
    return "";
  }
  return `<button class="btn" style="margin-top:10px" onclick="reclamarFicha('${p.id}')">¿Sos esta desarrolladora? Reclamá esta ficha</button>`;
}

// Tab "Proyectos a reclamar": fichas que todavía no tienen ninguna
// desarrolladora vinculada (desarrolladora_id null), para las que no
// hubo match automático por email al loguearse. Reutiliza el mismo
// reclamarFicha() + solicitudes_reclamo + aprobación admin de siempre.
async function proyectosAReclamar() {
  if (!st.desarrolladora) return `<h2>Proyectos a reclamar</h2><p class="sb">Primero creá tu cuenta de desarrolladora.</p>`;
  const { data, error } = await sb.from("proyectos")
    .select("id,nombre,barrio,subzona,desarrolladora_nombre_provisorio")
    .is("desarrolladora_id", null)
    .eq("reclamado", false)

  if (error) { console.error("proyectos a reclamar:", error); return `<h2>Proyectos a reclamar</h2><p class="sb">No se pudo cargar la lista.</p>`; }
  const lista = data || [];
  return `<h2>Proyectos a reclamar</h2>
  <p class="sb">Fichas que cargamos con datos públicos y todavía no tienen ninguna desarrolladora vinculada. Si alguna es tuya, reclamala — la revisamos y te avisamos.</p>
  <div class="grid">${lista.map(p => `<div class="bx" style="margin:0">
    <div class="r1"><b>${p.nombre}</b><span class="sb">${p.barrio}${p.subzona?" · "+p.subzona:""}</span></div>
    ${p.desarrolladora_nombre_provisorio ? `<p class="sb" style="margin-top:4px">Desarrolladora provisoria: ${p.desarrolladora_nombre_provisorio}</p>` : ""}
    ${reclamoBox(p)}
  </div>`).join("") || '<p class="sb">No quedan fichas sin reclamar por ahora.</p>'}</div>`;
}

function precioPorPiso(p, piso) {
  const base = p.precio_usd_m2 || 0;
  const inc = p.incremento_pct_piso || 0;
  return Math.round(base * Math.pow(1 + inc/100, Math.max(0, piso - 1)));
}

// -------- COMPRADOR: mi ficha / compartir --------
async function guardarFicha(extra = {}) {
  if (!st.ficha) st.ficha = {};
  const patch = {
    perfil_id: st.session.user.id,
    barrios: st.b, tipos: st.t,
    presupuesto_max_usd_m2: st.m, expensas_max_miles: st.e,
    imprescindibles: Object.keys(st.q).filter(k=>st.q[k]===2),
    deseables: Object.keys(st.q).filter(k=>st.q[k]===1),
    ...extra,
  };
  const { data, error } = await sb.from("fichas_compradoras").upsert(patch, { onConflict: "perfil_id" }).select().single();
  if (error) { toast("Error guardando ficha: " + error.message); return; }
  st.ficha = data;
  toast("Ficha guardada");
}

async function compartirFicha(proyectoId) {
  if (!st.session) { loginGoogle(); return; }
  if (!st.telefono) { toast("Cargá tu teléfono (obligatorio) antes de postularte."); go("inicio"); return; }
  // Si venimos de la pantalla de postulación, estos campos están en el DOM;
  // si no existen (p. ej. se llama desde otro lado), los ignoramos.
  const supMin = document.getElementById("supMin")?.value;
  const supMax = document.getElementById("supMax")?.value;
  const anticipo = document.getElementById("anticipoUsd")?.value;
  const extra = {};
  if (supMin) extra.superficie_min_m2 = +supMin;
  if (supMax) extra.superficie_max_m2 = +supMax;
  if (anticipo) extra.anticipo_usd = +anticipo;
  await guardarFicha(extra);
  const p = st.proyectos.find(x=>x.id===proyectoId);
  const { data: lead, error } = await sb.from("leads")
    .upsert({ proyecto_id: proyectoId, comprador_id: st.session.user.id, compatibilidad: sc(p).s }, { onConflict: "proyecto_id,comprador_id" })
    .select().single();
  if (error) { toast("Error: " + error.message); return; }
  await pagar(lead.id, "comprador");
}

async function pagar(leadId, rol) {
  toast("Redirigiendo a Mercado Pago…");
  const { data, error } = await sb.functions.invoke("create-preference", { body: { lead_id: leadId, rol } });
  if (error) { toast("No se pudo iniciar el pago. ¿Configuraste MP_ACCESS_TOKEN en la Edge Function?"); console.error(error); return; }
  if (data?.init_point) window.location.href = data.init_point;
}

// Se llama cuando se detecta que un lead pasó a "match" (contacto revelado en ambos
// sentidos). Reparte las insignias de gamificación una sola vez por cuenta.
async function otorgarInsignias(lead) {
  if (st.perfil?.rol === "comprador" && st.perfil && !(st.perfil.insignias||[]).includes("comprador_exitoso")) {
    const insignias = [...(st.perfil.insignias||[]), "comprador_exitoso"];
    const { error } = await sb.from("perfiles").update({ insignias }).eq("id", st.perfil.id);
    if (!error) st.perfil.insignias = insignias;
  }
  if (st.desarrolladora && !(st.desarrolladora.insignias||[]).includes("vendedor")) {
    const insignias = [...(st.desarrolladora.insignias||[]), "vendedor"];
    const { error } = await sb.from("desarrolladoras").update({ insignias }).eq("id", st.desarrolladora.id);
    if (!error) st.desarrolladora.insignias = insignias;
  }
}

async function marcarVendidaLead(leadId) {
  const uid = document.getElementById("vSel_" + leadId)?.value; if (!uid) return;
  if (!confirm("¿Confirmás que esta unidad se vendió a este comprador?")) return;
  const a = await sb.from("unidades").update({ estado: "vendida", vendida_via: "ladrillo_hub", lead_id: leadId, updated_at: new Date().toISOString() }).eq("id", uid);
  const b = await sb.from("leads").update({ unidad_id: uid }).eq("id", leadId);
  if (a.error || b.error) { toast("Error: " + (a.error || b.error).message); return; }
  toast("Venta registrada. La unidad quedó como vendida."); await cargarProyectos(); render();
}
async function generarPDFDocumentacion(proyectoId) {
  if (!proyectoId) { toast("No se encontró el proyecto"); return; }
  const { data: p } = await sb.from("proyectos").select("*, desarrolladoras(*)").eq("id", proyectoId).maybeSingle();
  if (!p) { toast("No se pudo cargar el proyecto"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 18;
  const linea = (t, bold) => { doc.setFont(undefined, bold ? "bold" : "normal"); doc.text(String(t), 14, y); y += 8; if (y > 280) { doc.addPage(); y = 18; } };
  linea("Ladrillo Hub — Ficha completa del proyecto", true);
  linea(p.nombre, true);
  linea(`Desarrolladora: ${p.desarrolladoras?.nombre || ""}`);
  linea(`Barrio: ${p.barrio || ""} · Tipo: ${p.tipo || ""}`);
  linea(`USD/m²: ${n(p.precio_usd_m2)}${p.pisos_totales ? " (piso 1) — " + p.pisos_totales + " pisos" : ""}`);
  y += 4;
  linea("Documentación cargada por la desarrolladora:", true);
  (p.documentos_activos || []).forEach(key => {
    const url = p.documentos?.[key];
    linea(`- ${docLabel(key)}: ${url ? url : "(condición activada, sin archivo)"}`);
  });
  if (p.fondo_reserva_incluido) linea("- Fondo de reserva incluido");
  if (p.fondo_equipamiento_incluido) linea("- Fondo de equipamiento incluido");
  if (p.brochure_url) linea(`- Brochure: ${p.brochure_url}`);
  doc.save(`ficha-${(p.nombre||"proyecto").replace(/\s+/g,"-")}.pdf`);
}

async function abrirEdicionProyecto(id, irAStock) {
  st.subiendo = true; render();
  const { data: p, error } = await sb.from("proyectos").select("*").eq("id", id).single();
  if (error || !p) { toast("No se pudo cargar el proyecto"); st.subiendo = false; render(); return; }
  const { data: fotos } = await sb.from("proyecto_fotos").select("*").eq("proyecto_id", id).order("orden");
  st.editProyectoId = id;
  st.editProyecto = p;
  st.editFotos = fotos || [];
  st.editUnidades = (await sb.from("unidades").select("*").eq("proyecto_id", id)).data || [];
  st.subiendo = false;
  render();
  if (irAStock) setTimeout(() => document.getElementById("stockSec")?.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
}
function cerrarEdicionProyecto() {
  st.editProyectoId = null; st.editProyecto = null; st.editFotos = [];
  render();
}

async function subirFotosEdicion(files, tipo) {
  if (!files || !files.length) return;
  const id = st.editProyectoId; if (!id) return;
  st.subiendo = true; render();
  let orden = st.editFotos.reduce((mx, f) => Math.max(mx, f.orden || 0), 0);
  for (const f of files) {
    const url = await subirArchivo(`proyectos/${id}/fotos/${Date.now()}-${f.name}`, f);
    if (!url) continue;
    orden += 1;
    const { data, error } = await sb.from("proyecto_fotos").insert({ proyecto_id: id, url, tipo, orden }).select().single();
    if (error) { toast("Error guardando foto: " + error.message); continue; }
    st.editFotos.push(data);
  }
  st.subiendo = false;
  st.fotosProyecto = null; // fuerza recarga del carrusel de la ficha
  render();
}
async function eliminarFotoEdicion(fotoId) {
  const { error } = await sb.from("proyecto_fotos").delete().eq("id", fotoId);
  if (error) { toast("Error borrando foto: " + error.message); return; }
  st.editFotos = st.editFotos.filter(f => f.id !== fotoId);
  st.fotosProyecto = null;
  render();
}

async function subirDocumentoEdicion(key, file) {
  if (!file) return;
  const id = st.editProyectoId; if (!id) return;
  st.subiendo = true; render();
  const url = await subirArchivo(`proyectos/${id}/docs/${key}-${Date.now()}-${file.name}`, file);
  if (url) {

async function recargarUnidades() {
  const id = st.editProyectoId;
  st.editUnidades = (await sb.from("unidades").select("*").eq("proyecto_id", id)).data || [];
  st.unidadesByProy[id] = st.editUnidades; render();
}
async function guardarDatosUnidades() {
  const orientacion = document.getElementById("uOri").value || null, unidades_por_piso = +document.getElementById("uXPiso").value || null;
  const { error } = await sb.from("proyectos").update({ orientacion, unidades_por_piso }).eq("id", st.editProyectoId);
  if (error) { toast("Error: " + error.message); return; }
  Object.assign(st.editProyecto, { orientacion, unidades_por_piso });
  const p = st.proyectos.find(x => x.id === st.editProyectoId); if (p) Object.assign(p, { orientacion, unidades_por_piso });
  toast("Datos guardados"); render();
}
const filaUnidad = (piso, letra, amb, sup, supDesc, ori, ubi) => ({ 
  proyecto_id: st.editProyectoId, 
  piso, 
  letra, 
  ambientes: amb || null, 
  superficie_m2: sup || null, 
  superficie_descubierta_m2: supDesc || null,
  orientacion: ori || null, 
  ubicacion: ubi || null,   // null en vez de ""
  estado: "disponible" 
});
async function agregarUnidad() {
  const g = (i) => document.getElementById(i).value, piso = +g("uPiso");
  if (!piso && piso !== 0) { toast("Falta el piso"); return; }
  
  // Convertimos strings vacíos a null para no romper los CHECK constraints
  const uOri = g("uOriU") || null;
  const uUbi = g("uUbi") || null;
  
  const { error } = await sb.from("unidades").insert(filaUnidad(
    piso, g("uLetra"), +g("uAmb"), +g("uSup"), +g("uSupDesc"), uOri, uUbi
  ));
  if (error) { toast("Error: " + error.message); return; }
  await recargarUnidades();
}
async function generarUnidades() {
  const g = (i) => +document.getElementById(i).value, d = g("gDesde"), h = g("gHasta") || d, c = g("gCant");
  if (!d || !c || c > 26 || h < d) { toast("Completá pisos y cantidad por piso (máx. 26)"); return; }
  const rows = [];
  for (let p = d; p <= h; p++) 
    for (let i = 0; i < c; i++) 
      // Acá ubicacion va null (no "") para no romper el CHECK
      rows.push(filaUnidad(p, LETRAS[i], g("gAmb"), g("gSup"), g("gSupDesc"), st.editProyecto.orientacion || null, null));
  
  const { error } = await sb.from("unidades").insert(rows);
  if (error) { toast("Error: " + error.message); return; }
  toast(rows.length + " unidades generadas"); 
  await recargarUnidades();
}
async function cambiarEstadoUnidad(id, estado) {
  const patch = { estado, updated_at: new Date().toISOString() };
  if (estado === "vendida") patch.vendida_via = st.editUnidades.find(u => u.id === id)?.lead_id ? "ladrillo_hub" : "otro_canal";
  else { patch.vendida_via = null; }
  const { error } = await sb.from("unidades").update(patch).eq("id", id);
  if (error) { toast("Error: " + error.message); return; }
  await recargarUnidades();
}
async function borrarUnidad(id) {
  if (!confirm("¿Borrar esta unidad?")) return;
  const { error } = await sb.from("unidades").delete().eq("id", id);
  if (error) { toast("Error: " + error.message); return; }
  await recargarUnidades();
}

// Verifica si el gmail del usuario coincide con el de un negocio dado de alta en
// Google Maps / Perfil de Empresa (tabla negocios_google, sincronizada externamente
// con la Google Business Profile API). Si coincide, se auto-verifica y se traen
// sus reseñas de Google automáticamente.
async function verificarNegocioGoogle() {
  if (!st.session?.user?.email) return;
  const { data } = await sb.from("negocios_google").select("*").eq("email", st.session.user.email).maybeSingle();
  if (!data) return;
  const patch = { gmail_verificado: true };
  if (st.perfil && !st.perfil.gmail_verificado) {
    await sb.from("perfiles").update(patch).eq("id", st.session.user.id);
    st.perfil.gmail_verificado = true;
  }
  if (st.desarrolladora && (data.google_rating || data.google_review_count)) {
    await sb.from("desarrolladoras").update({
      google_rating: data.google_rating, google_review_count: data.google_review_count,
      google_reviews_url: data.google_reviews_url, verificado: true,
    }).eq("id", st.desarrolladora.id);
    Object.assign(st.desarrolladora, { google_rating: data.google_rating, google_review_count: data.google_review_count, google_reviews_url: data.google_reviews_url, verificado: true });
  }
}

    <div class="timeline">${st.obraHitos.map(h=>`<div class="tl-it"><div class="r1"><b>${h.nombre}</b><button class="btn" style="width:auto;padding:4px 10px;margin:0;font-size:.72rem" onclick="marcarHito('${h.id}',${!h.cumplido})">${h.cumplido?"✅ Cumplido":"Marcar cumplido"}</button></div>
    <p class="sb">${h.cumplido ? "Cumplido" : "Estimado: " + (h.fecha_estimada||"a definir")}</p>
    ${h.descripcion?`<p class="sb" style="margin-top:4px">${h.descripcion}</p>`:""}
    ${h.documento_url?`<p style="margin-top:4px"><a href="${h.documento_url}" target="_blank" rel="noopener">Ver documento</a></p>`:""}</div>`).join("") || '<p class="sb" style="margin-top:10px">Todavía no cargaste hitos para este proyecto.</p>'}</div>
  </div>
  ${st.hitoModalOpen ? modalHitoHTML() : ""}`;
}
function seleccionarProyectoObra(id) { st.obraProyectoSel = id; render(); }
async function marcarHito(id, cumplido) {
  const { error } = await sb.from("hitos_obra").update({ cumplido }).eq("id", id);
  if (error) { toast("Error: " + error.message); return; }
  const h = st.obraHitos.find(x=>x.id===id); if (h) h.cumplido = cumplido;
  render();
}

  // Nueva función para calcular el % de completitud
function calcularProgresoProyecto(p) {
  const campos = [
    'precio_usd_m2', 'expensas_miles', 'anio_entrega', 'descripcion', 
    'fotos', 'brochure_url', 'render_url', 'documentos_activos', 'pisos_totales'
  ];
  let completados = 0;
  
  campos.forEach(campo => {
    const val = p[campo];
    if (Array.isArray(val) && val.length > 0) completados++;
    else if (typeof val === 'string' && val.trim() !== '') completados++;
    else if (typeof val === 'number' && val > 0) completados++;
  });

  // Contamos unidades como un dato más si existen
  const tieneUnidades = (st.unidadesByProy[p.id] || []).length > 0;
  if (tieneUnidades) completados++;
  
  const total = campos.length + 1;
  const pct = Math.round((completados / total) * 100);
  return pct;
}

// HTML del componente de progreso
function progresoHTML(p) {
  const pct = calcularProgresoProyecto(p);
  return `
    <div style="margin: 12px 0; padding: 10px; background: var(--soft); border-radius: 12px; border: 1px solid var(--ln);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span style="font-size: 0.8rem; font-weight: 700;">Información del proyecto</span>
        <span style="font-size: 0.8rem; font-weight: 700; color: ${pct > 70 ? 'var(--ok)' : 'var(--wn)'};">${pct}%</span>
      </div>
      <div class="bar" style="height: 6px;"><i style="width: ${pct}%; background: ${pct > 70 ? 'var(--ok)' : 'var(--wn)'};"></i></div>
      <p class="sb" style="margin-top: 8px; font-size: 0.7rem; line-height: 1.3; color: var(--gr);">
        Cuanto más información subas, más chances tenés de hacer match con un futuro comprador. La transparencia en la información es uno de nuestros pilares y objetivos.
      </p>
    </div>`;
}

// Manejo simple del regreso de Mercado Pago (?pago=ok|error|pendiente)
window.addEventListener("load", () => {
  const qp = new URLSearchParams(location.search);
  if (qp.get("pago")) {
    const map = { ok: "¡Pago aprobado!", error: "El pago no se pudo procesar.", pendiente: "Pago pendiente de aprobación." };
    setTimeout(() => toast(map[qp.get("pago")] || ""), 800);
    history.replaceState({}, "", location.pathname);
  }
});
